<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendar consulta — PodoClin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="pc-topbar py-3">
    <div class="pc-shell d-flex justify-content-between align-items-center" style="max-width:960px; padding-top:0; padding-bottom:0;">
      <span class="brand">Podo<span>Clin</span></span>
      <nav class="pc-desktop-nav">
        <a href="dashboard.html">Início</a>
        <a href="agenda.html">Agenda</a>
        <a href="buscar-horarios.html" class="is-active">Agendar consulta</a>
        <a href="index.html">Sair</a>
      </nav>
    </div>
  </header>

  <main class="pc-shell">
    <h1 class="h4 mt-3 mb-1">Agendar consulta</h1>
    <p class="text-muted-soft mb-3">Escolha o serviço e veja os horários disponíveis.</p>

    <div class="pc-card mb-3">
      <div class="pc-field mb-3">
        <label for="servico">Serviço</label>
        <select class="form-select" id="servico">
          <option selected>Podoprofilaxia</option>
          <option>Tratamento de onicomicose</option>
          <option>Pé diabético</option>
        </select>
      </div>

      <div class="pc-field mb-3">
        <label for="data-consulta">Data</label>
        <input type="date" class="form-control" id="data-consulta">
      </div>

      <label class="d-block mb-2">Horários disponíveis</label>
      <div class="row row-cols-3 g-2" id="grade-horarios">
        <div class="col"><div class="pc-slot-chip" data-hora="08:00">08:00</div></div>
        <div class="col"><div class="pc-slot-chip" data-hora="09:00">09:00</div></div>
        <div class="col"><div class="pc-slot-chip is-selected" data-hora="11:00">11:00</div></div>
        <div class="col"><div class="pc-slot-chip" data-hora="13:30">13:30</div></div>
        <div class="col"><div class="pc-slot-chip" data-hora="14:30">14:30</div></div>
        <div class="col"><div class="pc-slot-chip" data-hora="16:00">16:00</div></div>
      </div>
    </div>

    <div class="pc-card">
      <h2 class="h6 mb-3">Resumo da reserva</h2>
      <dl class="row small mb-3">
        <dt class="col-5 text-muted-soft fw-normal">Serviço</dt>
        <dd class="col-7 mb-1" id="resumo-servico">Podoprofilaxia</dd>
        <dt class="col-5 text-muted-soft fw-normal">Profissional</dt>
        <dd class="col-7 mb-1">Dra. Lia Raquel</dd>
        <dt class="col-5 text-muted-soft fw-normal">Data / hora</dt>
        <dd class="col-7 mb-1" id="resumo-data-hora">— / 11:00</dd>
      </dl>
      <button class="btn btn-pc-primary w-100" id="btn-confirmar">Confirmar e reservar</button>
      <p class="text-muted-soft small text-center mt-2 mb-0" id="reserva-feedback" aria-live="polite"></p>
    </div>
  </main>

  <nav class="pc-tabbar">
    <a href="dashboard.html"><span class="bi">🏠</span>Início</a>
    <a href="agenda.html"><span class="bi">📅</span>Agenda</a>
    <a href="buscar-horarios.html" class="is-active"><span class="bi">🔍</span>Agendar</a>
    <a href="index.html"><span class="bi">👤</span>Sair</a>
  </nav>

  <script src="js/main.js"></script>
</body>
</html>
