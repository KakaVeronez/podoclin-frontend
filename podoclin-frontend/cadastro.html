<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — PodoClin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="pc-topbar py-3 d-none d-lg-block">
    <div class="pc-shell d-flex justify-content-between align-items-center" style="max-width:960px; padding-top:0; padding-bottom:0;">
      <span class="brand">Podo<span>Clin</span></span>
    </div>
  </header>

  <main class="pc-shell">

    <div class="text-center mb-4 mt-4">
      <h1 class="h3 mb-1">Criar sua conta</h1>
      <p class="text-muted-soft mb-0">Leva menos de um minuto.</p>
    </div>

    <div class="pc-tabswitch">
      <a href="index.html">Entrar</a>
      <a href="cadastro.html" class="is-active">Cadastrar</a>
    </div>

    <div class="pc-card">
      <form id="form-cadastro" novalidate>

        <div class="pc-field mb-3">
          <label>Eu sou</label>
          <div class="btn-group w-100" role="group" aria-label="Tipo de usuário">
            <input type="radio" class="btn-check" name="tipoUsuario" id="tipo-cliente" value="cliente" checked>
            <label class="btn btn-pc-outline active" for="tipo-cliente">Cliente</label>

            <input type="radio" class="btn-check" name="tipoUsuario" id="tipo-podologo" value="podologo">
            <label class="btn btn-pc-outline" for="tipo-podologo">Podólogo</label>
          </div>
        </div>

        <div class="pc-field mb-3">
          <label for="cad-nome">Nome completo</label>
          <input type="text" class="form-control" id="cad-nome" required>
        </div>

        <div class="pc-field mb-3" id="campo-crm" style="display:none;">
          <label for="cad-crm">Registro profissional (CRM/CREFITO)</label>
          <input type="text" class="form-control" id="cad-crm">
        </div>

        <div class="pc-field mb-3">
          <label for="cad-email">E-mail</label>
          <input type="email" class="form-control" id="cad-email" required>
        </div>

        <div class="pc-field mb-3">
          <label for="cad-telefone">Telefone</label>
          <input type="tel" class="form-control" id="cad-telefone" placeholder="(86) 90000-0000" required>
        </div>

        <div class="pc-field mb-3">
          <label for="cad-senha">Senha</label>
          <input type="password" class="form-control" id="cad-senha" minlength="6" required>
          <div class="form-text">Mínimo de 6 caracteres.</div>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="cad-termos" required>
          <label class="form-check-label small text-muted-soft" for="cad-termos">
            Concordo com o tratamento criptografado dos meus dados de saúde, conforme a LGPD.
          </label>
        </div>

        <button type="submit" class="btn btn-pc-primary w-100 mb-2">Criar conta</button>
        <p class="text-muted-soft small text-center mb-0" id="cadastro-feedback" aria-live="polite"></p>
      </form>
    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
