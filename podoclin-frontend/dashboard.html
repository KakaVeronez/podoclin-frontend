<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Início — PodoClin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="pc-topbar py-3">
    <div class="pc-shell d-flex justify-content-between align-items-center" style="max-width:960px; padding-top:0; padding-bottom:0;">
      <span class="brand">Podo<span>Clin</span></span>
      <nav class="pc-desktop-nav">
        <a href="dashboard.html" class="is-active">Início</a>
        <a href="agenda.html">Agenda</a>
        <a href="buscar-horarios.html">Agendar consulta</a>
        <a href="index.html">Sair</a>
      </nav>
    </div>
  </header>

  <main class="pc-shell">
    <h1 class="h4 mt-3 mb-1">Olá, Dra. Lia 👋</h1>
    <p class="text-muted-soft">Aqui está o resumo do seu dia.</p>

    <div class="row g-2 my-3">
      <div class="col-4">
        <div class="pc-stat">
          <div class="value">6</div>
          <div class="label">Consultas hoje</div>
        </div>
      </div>
      <div class="col-4">
        <div class="pc-stat">
          <div class="value">2</div>
          <div class="label">No-shows (7d)</div>
        </div>
      </div>
      <div class="col-4">
        <div class="pc-stat">
          <div class="value">3</div>
          <div class="label">Retornos pendentes</div>
        </div>
      </div>
    </div>

    <div class="pc-card mb-3">
      <h2 class="h6 mb-3">Atalhos rápidos</h2>
      <div class="d-grid gap-2">
        <a href="agenda.html" class="btn btn-pc-outline text-start">📅 Ver minha agenda</a>
        <a href="buscar-horarios.html" class="btn btn-pc-outline text-start">🔍 Buscar horário para um cliente</a>
      </div>
    </div>
  </main>

  <nav class="pc-tabbar">
    <a href="dashboard.html" class="is-active"><span class="bi">🏠</span>Início</a>
    <a href="agenda.html"><span class="bi">📅</span>Agenda</a>
    <a href="buscar-horarios.html"><span class="bi">🔍</span>Agendar</a>
    <a href="index.html"><span class="bi">👤</span>Sair</a>
  </nav>

  <script src="js/main.js"></script>

</html>
