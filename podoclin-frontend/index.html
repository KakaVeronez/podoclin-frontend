<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — PodoClin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="pc-topbar py-3 d-none d-lg-block">
    <div class="pc-shell d-flex justify-content-between align-items-center" style="max-width:960px; padding-top:0; padding-bottom:0;">
      <span class="brand">Podo<span>Clin</span></span>
    </div>
  </header>

  <main class="pc-shell d-flex flex-column justify-content-center" style="min-height: calc(100vh - 80px);">

    <div class="text-center mb-4">
      <div class="mb-2" style="font-size:2rem;">🦶</div>
      <h1 class="h3 mb-1">Bem-vindo de volta</h1>
      <p class="text-muted-soft mb-0">Acesse sua conta para continuar seu cuidado com os pés.</p>
    </div>

    <div class="pc-tabswitch">
      <a href="index.html" class="is-active">Entrar</a>
      <a href="cadastro.html">Cadastrar</a>
    </div>

    <div class="pc-card">
      <form id="form-login" novalidate>
        <div class="pc-field mb-3">
          <label for="login-email">E-mail ou CRM</label>
          <input type="text" class="form-control" id="login-email" placeholder="voce@exemplo.com" required>
        </div>

        <div class="pc-field mb-2">
          <label for="login-senha">Senha</label>
          <div class="input-group">
            <input type="password" class="form-control" id="login-senha" placeholder="••••••••" required minlength="6">
            <button class="btn btn-outline-secondary" type="button" id="toggle-senha" aria-label="Mostrar senha">
              <i class="bi bi-eye"></i>👁
            </button>
          </div>
        </div>

        <div class="text-end mb-3">
          <a href="#" class="small">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn btn-pc-primary w-100 mb-3">Entrar</button>

        <p class="text-muted-soft small text-center mb-0" id="login-feedback" aria-live="polite"></p>
      </form>
    </div>

    <div class="pc-security-note mt-3">
      <span>🔒</span>
      <span>Seus dados de acesso são criptografados de ponta a ponta, conforme a LGPD.</span>
    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
